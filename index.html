<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mindbody Reporting &amp; Marketing</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (!root || root.childElementCount > 0) return;
        root.innerHTML = '<div style="font-family:system-ui,sans-serif;max-width:560px;margin:64px auto;padding:24px;border:1px solid #fecaca;border-radius:12px;background:#fff"><b style="color:#b91c1c">The app failed to start</b><pre style="white-space:pre-wrap;font-size:12px;background:#f8fafc;padding:12px;border-radius:8px;margin-top:12px"></pre><button onclick="location.reload()" style="margin-top:12px;padding:6px 12px;border-radius:8px;border:1px solid #cbd5e1;background:#fff;cursor:pointer">Reload</button></div>';
        root.querySelector('pre').textContent = (e.error && e.error.stack) || e.message;
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
